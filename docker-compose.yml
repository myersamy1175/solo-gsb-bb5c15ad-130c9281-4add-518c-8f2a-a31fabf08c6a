services:
  stoich:
    build: .
    image: reaction-balancer:latest
    container_name: reaction-balancer
    ports:
      # 宿主机 8000 -> 容器 8000；如需改端口，修改冒号左侧即可
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
